name: Build LSPosed API 102 APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Scaffold Project Files (Self-Contained Mode for Mobile Users)
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            cat << 'SETTINGS_EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "QQPatchedTextViewHook"
          include(":app")
          SETTINGS_EOF
          fi

          if [ ! -f "build.gradle.kts" ]; then
            cat << 'ROOT_GRADLE_EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          ROOT_GRADLE_EOF
          fi

          if [ ! -f "gradle.properties" ]; then
            cat << 'PROPS_EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          PROPS_EOF
          fi

          mkdir -p app/src/main/java/com/example/qqpatchedtextview
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/resources/META-INF/xposed

          if [ ! -f "app/keystore.jks" ]; then
            keytool -genkeypair -v               -keystore app/keystore.jks               -alias module_key               -keyalg RSA               -keysize 2048               -validity 10000               -storepass 123456               -keypass 123456               -dname "CN=QQPatchedTextViewHook, OU=LSPosed, O=Module, L=City, S=State, C=CN"
          fi

          if [ ! -f "app/build.gradle.kts" ]; then
            cat << 'APP_GRADLE_EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.example.qqpatchedtextview"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.qqpatchedtextview"
                  minSdk = 29
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("keystore.jks")
                      storePassword = "123456"
                      keyAlias = "module_key"
                      keyPassword = "123456"
                      enableV1Signing = true
                      enableV2Signing = true
                      enableV3Signing = true
                  }
              }

              buildTypes {
                  debug {
                      signingConfig = signingConfigs.getByName("release")
                  }
                  release {
                      isMinifyEnabled = true
                      signingConfig = signingConfigs.getByName("release")
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_21
                  targetCompatibility = JavaVersion.VERSION_21
              }

              packaging {
                  resources {
                      merges += "META-INF/xposed/*"
                  }
              }
          }

          dependencies {
              compileOnly("io.github.libxposed:api:102.0.0")
              compileOnly("androidx.annotation:annotation:1.9.1")
          }
          APP_GRADLE_EOF
          fi

          if [ ! -f "app/proguard-rules.pro" ]; then
            cat << 'PROGUARD_EOF' > app/proguard-rules.pro
          -dontwarn io.github.libxposed.annotation.**
          -adaptresourcefilecontents META-INF/xposed/java_init.list
          -keep,allowoptimization,allowobfuscation public class * extends io.github.libxposed.api.XposedModule {
              public <init>();
          }
          PROGUARD_EOF
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            cat << 'MANIFEST_EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:description="@string/module_description"
                  android:hasCode="true" />
          </manifest>
          MANIFEST_EOF
          fi

          if [ ! -f "app/src/main/res/values/strings.xml" ]; then
            cat << 'STRINGS_EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">QQ PatchedTextView Fix (API 102)</string>
              <string name="module_description">Replace PatchedTextView.onMeasure with SpannedString refresh and safe catch handling</string>
          </resources>
          STRINGS_EOF
          fi

          if [ ! -f "app/src/main/resources/META-INF/xposed/module.prop" ]; then
            cat << 'MODPROP_EOF' > app/src/main/resources/META-INF/xposed/module.prop
          minApiVersion=102
          targetApiVersion=102
          staticScope=false
          exceptionMode=protective
          autoHotReload=true
          MODPROP_EOF
          fi

          if [ ! -f "app/src/main/resources/META-INF/xposed/java_init.list" ]; then
            cat << 'JAVAINIT_EOF' > app/src/main/resources/META-INF/xposed/java_init.list
          com.example.qqpatchedtextview.MainModule
          JAVAINIT_EOF
          fi

          if [ ! -f "app/src/main/resources/META-INF/xposed/scope.list" ]; then
            cat << 'SCOPE_EOF' > app/src/main/resources/META-INF/xposed/scope.list
          com.tencent.mobileqq
          SCOPE_EOF
          fi

          if [ ! -f "app/src/main/java/com/example/qqpatchedtextview/MainModule.java" ]; then
            cat << 'JAVA_EOF' > app/src/main/java/com/example/qqpatchedtextview/MainModule.java
          package com.example.qqpatchedtextview;

          import android.text.Spanned;
          import android.text.SpannedString;
          import android.util.Log;
          import android.widget.TextView;

          import androidx.annotation.NonNull;

          import java.lang.reflect.InvocationTargetException;
          import java.lang.reflect.Method;

          import io.github.libxposed.api.XposedInterface;
          import io.github.libxposed.api.XposedModule;

          public class MainModule extends XposedModule {

              private static final String TAG = "PatchedTextViewHook";
              private static final String QQ_PACKAGE = "com.tencent.mobileqq";
              private static final String TARGET_CLASS = "com.tencent.mobileqq.widget.PatchedTextView";
              private static final String QLOG_CLASS = "com.tencent.qphone.base.util.QLog";
              private static final String HOOK_ID = "patched_text_view_on_measure";

              public MainModule() {
                  super();
              }

              @Override
              public void onModuleLoaded(@NonNull ModuleLoadedParam param) {
                  if (param.isSystemServer()) {
                      detach();
                      return;
                  }
                  String processName = param.getProcessName();
                  if (!processName.equals(QQ_PACKAGE) && !processName.startsWith(QQ_PACKAGE + ":")) {
                      detach();
                  }
              }

              @Override
              public void onPackageReady(@NonNull PackageReadyParam param) {
                  if (!QQ_PACKAGE.equals(param.getPackageName())) {
                      return;
                  }
                  installHook(param.getClassLoader(), null);
              }

              @Override
              public boolean onHotReloading(@NonNull HotReloadingParam param) {
                  return true;
              }

              @Override
              public void onHotReloaded(@NonNull HotReloadedParam param) {
                  for (XposedInterface.HookHandle oldHandle : param.getOldHookHandles()) {
                      ClassLoader cl = oldHandle.getExecutable().getDeclaringClass().getClassLoader();
                      if (cl != null) {
                          installHook(cl, oldHandle);
                          return;
                      }
                  }
              }

              private void installHook(@NonNull ClassLoader classLoader, XposedInterface.HookHandle oldHandle) {
                  try {
                      Class<?> patchedTextViewClass = Class.forName(TARGET_CLASS, false, classLoader);
                      Method onMeasureMethod = patchedTextViewClass.getDeclaredMethod("onMeasure", int.class, int.class);
                      Method superOnMeasureMethod = TextView.class.getDeclaredMethod("onMeasure", int.class, int.class);

                      Invoker<?, Method> superOnMeasureInvoker = getInvoker(superOnMeasureMethod);

                      Method isColorLevelMethod = null;
                      Method qLogEMethod = null;
                      try {
                          Class<?> qLogClass = Class.forName(QLOG_CLASS, false, classLoader);
                          isColorLevelMethod = qLogClass.getDeclaredMethod("isColorLevel");
                          qLogEMethod = qLogClass.getDeclaredMethod(
                                  "e", String.class, int.class, String.class, Throwable.class);
                      } catch (Throwable ignored) {
                      }

                      final Method finalIsColorLevel = isColorLevelMethod;
                      final Method finalQLogE = qLogEMethod;

                      Hooker onMeasureHooker = chain -> {
                          TextView self = (TextView) chain.getThisObject();
                          int widthMeasureSpec = (int) chain.getArg(0);
                          int heightMeasureSpec = (int) chain.getArg(1);

                          try {
                              CharSequence v0 = self.getText();
                              if (v0 != null && v0 instanceof Spanned) {
                                  self.setText(new SpannedString(v0));
                              }
                              invokeSuperOnMeasure(superOnMeasureInvoker, self, widthMeasureSpec, heightMeasureSpec);
                          } catch (Exception v0) {
                              logQLogError(finalIsColorLevel, finalQLogE, v0);
                              CharSequence text = self.getText();
                              if (text != null) {
                                  self.setText(text);
                                  invokeSuperOnMeasure(superOnMeasureInvoker, self, widthMeasureSpec, heightMeasureSpec);
                              }
                          }
                          return null;
                      };

                      if (oldHandle != null) {
                          oldHandle.replaceHook(onMeasureHooker);
                      } else {
                          hook(onMeasureMethod)
                                  .setId(HOOK_ID)
                                  .setPriority(PRIORITY_DEFAULT)
                                  .setExceptionMode(ExceptionMode.PROTECTIVE)
                                  .intercept(onMeasureHooker);
                      }
                  } catch (Throwable t) {
                      log(Log.ERROR, TAG, "Failed to hook PatchedTextView.onMeasure", t);
                  }
              }

              private static void invokeSuperOnMeasure(
                      Invoker<?, Method> superOnMeasureInvoker,
                      TextView self,
                      int widthMeasureSpec,
                      int heightMeasureSpec) throws Throwable {
                  try {
                      superOnMeasureInvoker.invokeSpecial(self, widthMeasureSpec, heightMeasureSpec);
                  } catch (InvocationTargetException e) {
                      Throwable cause = e.getCause();
                      throw (cause != null) ? cause : e;
                  }
              }

              private void logQLogError(Method isColorLevelMethod, Method qLogEMethod, Exception exception) {
                  try {
                      if (isColorLevelMethod != null && qLogEMethod != null) {
                          Boolean isColor = (Boolean) isColorLevelMethod.invoke(null);
                          if (Boolean.TRUE.equals(isColor)) {
                              qLogEMethod.invoke(
                                      null,
                                      "PatchedTextView",
                                      2,
                                      "Error : Exception thrown in PatchedTextView.onMeasure",
                                      exception);
                          }
                      }
                  } catch (Throwable ignored) {
                      log(Log.ERROR, "PatchedTextView", "Error : Exception thrown in PatchedTextView.onMeasure", exception);
                  }
              }
          }
          JAVA_EOF
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug & Signed Release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: QQPatchedTextViewHook-API102-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QQPatchedTextViewHook-API102-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
